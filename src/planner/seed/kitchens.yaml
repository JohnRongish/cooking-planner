    work_end: "22:00"
  - id: home-kitchen
    name: Home kitchen
    description: Typical home kitchen, one or two cooks.
    equipment_inventory:
      - {type: oven, count: 1, capacity: 2, label: Oven (2 sheet pans)}
      - {type: burner, count: 4}
      - {type: pot, count: 1, capacity: 12, label: 12 L stock pot}
      - {type: pot, count: 2, capacity: 4, label: 4 L saucepan}
      - {type: pan, count: 2, capacity: 3}
      - {type: prep_table, count: 1}
      - {type: fridge, count: 2}
