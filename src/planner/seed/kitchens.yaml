schema_version: 1
kind: kitchens
kitchens:
  - id: backpacking
    name: Backpacking (1 stove, 1 pot)
    description: One canister stove, one 3 L pot, one cook. No ovens, no fridge.
    equipment_inventory:
      - {type: burner, count: 1, label: Canister stove}
      - {type: pot, count: 1, capacity: 3, label: 3 L pot}
    max_cooks: 1
    supports_tags: [backpacking, no-cook, one-pot]
    work_start: "05:30"
    work_end: "22:00"
  - id: camp-kitchen
    name: Camp kitchen (2 ovens, 6 burners, large pots)
