      - {type: oven, count: 2, capacity: 6, label: Convection oven (6 sheet pans)}
      - {type: burner, count: 6}
      - {type: pot, count: 2, capacity: 40, label: 40 L stock pot}
      - {type: pot, count: 3, capacity: 20, label: 20 L pot}
      - {type: pan, count: 4, capacity: 5, label: Large sauté pan}
      - {type: prep_table, count: 3}
      - {type: fridge, count: 4, label: Walk-in shelf bay}
    max_cooks: 8
    supports_tags: [bulk, camp, no-cook, one-pot, breakfast, lunch, dinner, vegetarian]
