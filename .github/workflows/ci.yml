name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy (strict on planner.core)
        run: mypy src
      - name: Pytest (core coverage must stay at or above 90%)
        run: pytest --cov=planner.core --cov-report=term-missing --cov-fail-under=90

  image:
    name: Docker image builds and passes the smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: planner:ci
          cache-from: type=gha,scope=planner
          cache-to: type=gha,scope=planner,mode=max
      - name: Smoke test (fresh empty /data, migrate, /healthz, outputs, PDF)
        run: scripts/smoke-test.sh planner:ci
